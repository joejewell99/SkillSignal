server:
  port: 8080
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillsignal}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
    org.springframework.web.client.RestClient: INFO
    org.springframework.http.converter.json: INFO

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  security:
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    auth-requests-per-minute: ${AUTH_REQUESTS_PER_MINUTE:10}
    write-requests-per-minute: ${WRITE_REQUESTS_PER_MINUTE:300}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
    expected-hostname: ${TURNSTILE_EXPECTED_HOSTNAME:}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  admin:
    email: ${SKILLSIGNAL_ADMIN_EMAIL:}
    password: ${SKILLSIGNAL_ADMIN_PASSWORD:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
