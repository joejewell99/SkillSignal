services:
  postgres:
    image: postgres:16
    container_name: skillsignal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsignal}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER before starting Postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Postgres}
    ports:
      - "5432:5432"
    volumes:
      - skillsignal-postgres-data:/var/lib/postgresql/data

volumes:
  skillsignal-postgres-data:
